spring:
  application:
    name: soft-energy-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/soft_energy_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:softenergy}
    password: ${DB_PASSWORD:softenergy_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

soft-energy:
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    jwt-issuer: soft-energy-leaderboard
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:720}
    phone-key-base64: ${PHONE_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    phone-hmac-base64: ${PHONE_HMAC_BASE64:ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  wechat:
    mock-enabled: ${WECHAT_MOCK_ENABLED:true}
    content-security-enabled: ${WECHAT_CONTENT_SECURITY_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:123456}
    admin-display-name: ${ADMIN_DISPLAY_NAME:内容管理员}
    demo-data-enabled: ${DEMO_DATA_ENABLED:false}

logging:
  level:
    root: INFO
    com.softenergy.leaderboard: INFO
