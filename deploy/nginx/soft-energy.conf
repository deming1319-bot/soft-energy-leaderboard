# 知行问答正式域名 HTTPS 配置。
# 管理端：https://ruannengliang.top/
# 后端 API：https://api.ruannengliang.top/api/v1
# Jenkins：https://ruannengliang.top/jenkins/

# 正式域名统一跳转到 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name ruannengliang.top api.ruannengliang.top;
    return 301 https://$host$request_uri;
}

# 旧公网 IP 入口统一跳转到正式管理端域名，并保留原请求路径。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 123.56.169.70;
    return 301 https://ruannengliang.top$request_uri;
}

# 仅供 Jenkins 在服务器本机验证管理端和 /api 代理，不对公网开放。
server {
    listen 127.0.0.1:18080;
    server_name localhost;
    charset utf-8;

    root /opt/soft-energy/current/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}

# 管理端和 Jenkins 正式 HTTPS 入口。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ruannengliang.top;
    charset utf-8;

    ssl_certificate /etc/nginx/ssl/ruannengliang.top/ruannengliang.top.pem;
    ssl_certificate_key /etc/nginx/ssl/ruannengliang.top/ruannengliang.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/soft-energy/current/web;
    index index.html;
    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /jenkins {
        return 302 /jenkins/;
    }

    location /jenkins/ {
        proxy_pass http://127.0.0.1:8080/jenkins/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(swagger-ui|v3/api-docs) { return 404; }
    location /actuator/ { return 404; }
}

# 小程序和其他客户端使用的独立 API HTTPS 入口。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ruannengliang.top;

    ssl_certificate /etc/nginx/ssl/api.ruannengliang.top/api.ruannengliang.top.pem;
    ssl_certificate_key /etc/nginx/ssl/api.ruannengliang.top/api.ruannengliang.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
    location ~ ^/(swagger-ui|v3/api-docs) { return 404; }
    location /actuator/ { return 404; }
}
