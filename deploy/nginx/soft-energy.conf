server {
    listen 80;
    server_name admin.example.com api.example.com;
    return 301 https://$host$request_uri;
}

# 仅供 Jenkins 在服务器本机验证 Vue 和 /api 代理，不对公网开放。
server {
    listen 127.0.0.1:18080;
    server_name localhost;
    charset utf-8;

    root /opt/soft-energy/current/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;
    charset utf-8;

    ssl_certificate /etc/nginx/ssl/admin.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/soft-energy/current/web;
    index index.html;
    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location ~ ^/(swagger-ui|v3/api-docs) { return 404; }
    location /actuator/ { return 404; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate /etc/nginx/ssl/api.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/api.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
    location /actuator/ { return 404; }
}
